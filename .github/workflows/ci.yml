name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: cargo-

      - name: Cache cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-jj

      - name: Install jj
        run: command -v jj || cargo install jj-cli

      - name: Check formatting
        run: cargo fmt --manifest-path server/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test --manifest-path server/Cargo.toml

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm -r run build

      - name: Biome check
        run: pnpm biome check .
