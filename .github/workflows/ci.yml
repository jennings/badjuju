name: CI

on:
  push:
  pull_request:

# Read-only by default; jobs override only if they need more.
permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: cargo-

      - name: Cache cargo bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin
          key: cargo-bin-jj

      - name: Install jj
        run: command -v jj || cargo install jj-cli

      - name: Install redo
        run: |
          git clone --depth 1 https://github.com/apenwarr/redo /tmp/redo
          cd /tmp/redo && sudo DESTDIR= ./do install

      - name: Check (fmt + clippy + test)
        run: redo server/check

  neovim:
    name: Neovim
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      - name: Verify Neovim is installed
        # Guard against silent skips: clients/neovim/scripts/test.sh exits 0
        # when nvim is missing on local machines. In CI we want a hard
        # failure if the setup step above didn't actually install nvim.
        run: nvim --version

      - name: Install redo
        run: |
          git clone --depth 1 https://github.com/apenwarr/redo /tmp/redo
          cd /tmp/redo && sudo DESTDIR= ./do install

      - name: Cache plenary.nvim
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: clients/neovim/.test-deps/plenary.nvim
          key: plenary-nvim-stable

      - name: Run Neovim plugin tests
        run: redo clients/neovim/test

  emacs:
    name: Emacs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Emacs
        uses: purcell/setup-emacs@509bfe03ba1ffddb67b3c6d9eaaeb96b45182cc7 # master
        with:
          version: '29.4'

      - name: Verify Emacs is installed
        # Guard against silent skips: clients/emacs/scripts/test.sh exits 0
        # when emacs is missing on local machines. In CI we want a hard
        # failure if the setup step above didn't actually install emacs.
        run: emacs --version

      - name: Cache cargo bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin
          key: cargo-bin-jj

      - name: Install jj
        run: command -v jj || cargo install jj-cli

      - name: Install redo
        run: |
          git clone --depth 1 https://github.com/apenwarr/redo /tmp/redo
          cd /tmp/redo && sudo DESTDIR= ./do install

      - name: Run Emacs ERT suite
        run: redo clients/emacs/test
        env:
          BADJUJU_E2E: '1'

  helix-steel:
    name: Helix (Steel)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Cache cargo bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin
          key: cargo-bin-steel

      - name: Install steel
        # Installs the standalone `steel` interpreter, not a Steel-enabled
        # Helix — see clients/helix-steel/README.md's "Testing" section for
        # why a real Steel-Helix build isn't exercised here.
        run: command -v steel || cargo install steel-interpreter

      - name: Verify steel is installed
        # Guard against silent skips: clients/helix-steel/test/run.sh exits 0
        # when steel is missing on local machines. In CI we want a hard
        # failure if the install step above didn't actually install it.
        run: steel --version

      - name: Install redo
        run: |
          git clone --depth 1 https://github.com/apenwarr/redo /tmp/redo
          cd /tmp/redo && sudo DESTDIR= ./do install

      - name: Run helix-steel plugin tests
        run: redo clients/helix-steel/test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install redo
        run: |
          git clone --depth 1 https://github.com/apenwarr/redo /tmp/redo
          cd /tmp/redo && sudo DESTDIR= ./do install

      - name: Cache cargo bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin
          key: cargo-bin-jj

      - name: Install jj
        run: command -v jj || cargo install jj-cli

      - name: Install dependencies
        run: pnpm install

      - name: Build VS Code extension
        run: redo clients/vscode/all

      - name: Run VS Code tests
        run: xvfb-run -a redo clients/vscode/test

      - name: Biome check
        run: pnpm biome check .
