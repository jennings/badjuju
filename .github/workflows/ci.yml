name: CI

on:
  push:
  pull_request:

# Read-only by default; jobs override only if they need more.
permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: cargo-

      - name: Cache cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-jj

      - name: Install jj
        run: command -v jj || cargo install jj-cli

      - name: Install redo
        run: |
          git clone --depth 1 https://github.com/apenwarr/redo /tmp/redo
          cd /tmp/redo && sudo DESTDIR= ./do install

      - name: Check (fmt + clippy + test)
        run: redo server/check

  neovim:
    name: Neovim
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Verify Neovim is installed
        # Guard against silent skips: clients/neovim/scripts/test.sh exits 0
        # when nvim is missing on local machines. In CI we want a hard
        # failure if the setup step above didn't actually install nvim.
        run: nvim --version

      - name: Install redo
        run: |
          git clone --depth 1 https://github.com/apenwarr/redo /tmp/redo
          cd /tmp/redo && sudo DESTDIR= ./do install

      - name: Cache plenary.nvim
        uses: actions/cache@v4
        with:
          path: clients/neovim/.test-deps/plenary.nvim
          key: plenary-nvim-stable

      - name: Run Neovim plugin tests
        run: redo clients/neovim/test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install redo
        run: |
          git clone --depth 1 https://github.com/apenwarr/redo /tmp/redo
          cd /tmp/redo && sudo DESTDIR= ./do install

      - name: Cache cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-jj

      - name: Install jj
        run: command -v jj || cargo install jj-cli

      - name: Install dependencies
        run: pnpm install

      - name: Build VS Code extension
        run: redo clients/vscode/all

      - name: Run VS Code tests
        run: xvfb-run -a redo clients/vscode/test

      - name: Biome check
        run: pnpm biome check .
